<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 1200">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="{{accent}}"/>
      <stop offset="0.62" stop-color="{{accent}}" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0c0c0f" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.27" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="300" height="1200" fill="#0c0c0f"/>
  <rect width="300" height="1200" fill="url(#fade)"/>
  <rect width="300" height="1200" fill="url(#glow)"/>
  <g fill="none" stroke="#ffffff" stroke-width="2">
    <circle cx="150" cy="320" r="96" stroke-opacity="0.34"/>
    <circle cx="150" cy="320" r="150" stroke-opacity="0.2"/>
    <circle cx="150" cy="320" r="210" stroke-opacity="0.1"/>
    <path d="M150 520 V1200" stroke-opacity="0.12"/>
  </g>
  <text x="150" y="320" dy="0.35em" text-anchor="middle" font-family="Segoe UI, system-ui, sans-serif"
    font-size="120" font-weight="700" fill="#ffffff" fill-opacity="0.94">{{initial}}</text>
</svg>
